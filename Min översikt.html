<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Min översikt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: en hög glaskort-kolumn centrerad över en blå-till-lavendel gradient. Hela sidan är ett enda mörkt uttryck. */
:root {
  --sky-top: #2c4a8c;
  --sky-bottom: #7a6cbc;
  --card: #233868;
  --pop: #2d4580;
  --ink: #f3f5ff;
  --ink-dim: #b7c1e6;
  --line: rgba(255, 255, 255, 0.3);
  --glass: rgba(255, 255, 255, 0.08);
  --glass-strong: rgba(255, 255, 255, 0.16);
  --accent: #9db2ff;
  --accent-ink: #1b2a55;
  --late: #ffb3bf;
  --font: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }

html, body { min-height: 100%; }

body {
  margin: 0;
  background-color: var(--sky-top);
  background-image: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  padding-block: 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex;
  justify-content: center;
  align-items: flex-start;
}

button, input { font: inherit; color: inherit; }

button { cursor: pointer; }

:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app {
  position: relative;
  width: 100%;
  max-width: 452px;
  min-height: 667px;
  background: var(--card);
  border-radius: 40px;
  padding: 44px 32px 32px;
  box-shadow: 0 30px 60px -30px rgba(10, 20, 60, 0.6);
  display: flex;
  flex-direction: column;
  gap: 0;
}

.eyebrow { margin: 0; font-size: 13px; font-weight: 500; }
h1 { margin: 14px 0 0; font-size: 24px; font-weight: 500; line-height: 1.15; text-wrap: balance; }
.sub { margin: 10px 0 0; font-size: 12px; color: var(--ink-dim); }

/* Ny uppgift */
.composer {
  margin-top: 22px;
  display: flex;
  align-items: center;
  gap: 8px;
  min-height: 40px;
  padding: 5px 6px 5px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--glass);
}
.composer:focus-within { border-color: var(--accent); }

.composer input[type="text"] {
  flex: 1;
  min-width: 0;
  background: none;
  border: 0;
  outline: 0;
  font-size: 14px;
  font-weight: 500;
}
.composer input[type="text"]::placeholder { color: var(--ink-dim); opacity: 1; }

.pick {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 50%;
  background: none;
  color: var(--ink-dim);
  flex: none;
  padding: 0;
}
.pick:hover, .pick.on, .pick[aria-expanded="true"] { color: var(--ink); background: var(--glass-strong); }
.pick svg { pointer-events: none; }

.btn {
  height: 26px;
  padding: 0 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--glass-strong);
  font-size: 12px;
  white-space: nowrap;
}
.btn:hover { background: rgba(255, 255, 255, 0.26); }

/* Lägg till: dämpad tills det finns text, tydligt aktiv när det finns */
#addBtn:disabled {
  background: transparent;
  border-color: rgba(255, 255, 255, 0.18);
  color: rgba(183, 193, 230, 0.55);
  cursor: not-allowed;
}
#addBtn:not(:disabled) {
  background: var(--accent);
  border-color: var(--accent);
  color: var(--accent-ink);
  font-weight: 700;
}
#addBtn:not(:disabled):hover { background: #b9c8ff; }

.chosen {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 8px;
  padding-left: 12px;
}
.chosen:empty { display: none; }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 22px;
  padding: 0 4px 0 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--glass);
  font-size: 11px;
}
.chip button {
  width: 16px; height: 16px; border: 0; border-radius: 50%;
  background: none; color: var(--ink-dim); line-height: 1; padding: 0;
}
.chip button:hover { color: var(--ink); background: var(--glass-strong); }

/* Lista */
.panel {
  margin-top: 18px;
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 10px 10px 8px;
  background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0));
}

.filters { display: flex; gap: 8px; margin-bottom: 4px; flex-wrap: wrap; }
.filter {
  height: 20px;
  padding: 0 10px;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: var(--glass);
  font-size: 10px;
  color: var(--ink-dim);
}
.filter[aria-pressed="true"] { background: var(--glass-strong); color: var(--ink); font-weight: 700; border-color: rgba(255,255,255,0.5); }

.task { padding: 8px 0; }
.task + .task { border-top: 1px solid rgba(157, 178, 255, 0.35); }

.row { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.row .grow { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; }

.check {
  appearance: none;
  -webkit-appearance: none;
  flex: none;
  width: 16px;
  height: 16px;
  margin: 0;
  border-radius: 4px;
  border: 1px solid rgba(255,255,255,0.45);
  background: rgba(255,255,255,0.14);
  display: grid;
  place-items: center;
  cursor: pointer;
}
.check:checked { background: var(--accent); border-color: var(--accent); }
.check:checked::after {
  content: "";
  width: 8px; height: 4px;
  border-left: 2px solid var(--card);
  border-bottom: 2px solid var(--card);
  transform: translateY(-1px) rotate(-45deg);
}
.check.small { width: 14px; height: 14px; border-radius: 3px; }
.check.small:checked::after { width: 7px; height: 3px; }

.title {
  min-width: 0;
  background: none;
  border: 0;
  padding: 2px 0;
  text-align: left;
  font-size: 14px;
  font-weight: 500;
  overflow-wrap: anywhere;
}
.title:hover { text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
.task.done > .row .title { color: var(--ink-dim); text-decoration: line-through; }

.pills { display: flex; gap: 6px; flex: none; }
.pill {
  height: 24px;
  padding: 0 12px;
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, rgba(255,255,255,0.2), rgba(255,255,255,0.08));
  font-size: 11px;
  font-weight: 500;
  white-space: nowrap;
}
.pill:hover { border-color: rgba(255, 255, 255, 0.55); }
.pill[aria-expanded="true"] { border-color: var(--accent); }
.pill.late { color: var(--late); border-color: rgba(255, 179, 191, 0.5); }
.pill.add { background: none; border-style: dashed; color: var(--ink-dim); font-weight: 400; }
.pill.add:hover { color: var(--ink); }

.acts { display: flex; align-items: center; gap: 2px; flex: none; }
.icon {
  min-width: 24px;
  height: 24px;
  display: inline-grid;
  place-items: center;
  border: 0;
  border-radius: 999px;
  background: none;
  color: var(--ink-dim);
  padding: 0;
  font-size: 15px;
  line-height: 1;
}
.icon:hover { background: var(--glass-strong); color: var(--ink); }
.icon svg { pointer-events: none; }
.icon.small { min-width: 20px; height: 20px; font-size: 14px; margin-left: auto; }
.icon.confirm {
  padding: 0 9px;
  height: 22px;
  border: 1px solid rgba(255, 179, 191, 0.55);
  color: var(--late);
  font-size: 10.5px;
  font-weight: 700;
  white-space: nowrap;
}
.edit { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; }
.edit input[type="text"] {
  flex: 1;
  min-width: 0;
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--accent);
  border-radius: 999px;
  background: var(--glass);
  outline: 0;
  font-size: 13px;
  font-weight: 500;
}
.sub-item .edit input[type="text"] { height: 24px; font-size: 12px; }

.subs { list-style: none; margin: 4px 0 0; padding: 0 0 0 12px; }
.sub-item { display: flex; align-items: center; gap: 8px; min-height: 26px; }
.sub-item .title { font-size: 13px; }
.sub-item.done .title { color: var(--ink-dim); text-decoration: line-through; }

.more { margin: 6px 0 2px 24px; display: flex; gap: 8px; align-items: center; }
.more input[type="text"] {
  flex: 1;
  min-width: 0;
  height: 26px;
  padding: 0 10px;
  border: 1px solid var(--line);
  border-radius: 999px;
  background: var(--glass);
  outline: 0;
  font-size: 12px;
}
.more input[type="text"]:focus { border-color: var(--accent); }
.more input::placeholder { color: var(--ink-dim); opacity: 1; }
.btn.danger { color: var(--late); }

.empty { margin: 18px 6px 14px; color: var(--ink-dim); font-size: 12px; text-wrap: balance; }

/* Väljare för datum och tid */
.pop {
  position: absolute;
  z-index: 30;
  width: 272px;
  max-width: calc(100% - 24px);
  padding: 14px;
  background: var(--pop);
  border: 1px solid var(--line);
  border-radius: 22px;
  box-shadow: 0 24px 48px -16px rgba(8, 16, 50, 0.75);
}
.pop[hidden] { display: none; }
.pop.time { width: 244px; }

.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.cal-title { font-size: 13px; font-weight: 500; }
.nav {
  width: 28px; height: 28px; border-radius: 50%;
  border: 1px solid var(--line); background: var(--glass);
  display: grid; place-items: center; padding: 0; font-size: 16px; line-height: 1;
}
.nav:hover { background: var(--glass-strong); }

.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.cal-week { margin-bottom: 4px; }
.cal-week span { text-align: center; font-size: 10px; color: var(--ink-dim); }
.cal-grid { gap: 2px; }
.day {
  aspect-ratio: 1;
  border: 1px solid transparent;
  border-radius: 50%;
  background: none;
  padding: 0;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.day:hover { background: var(--glass-strong); }
.day.out { color: var(--ink-dim); opacity: 0.5; }
.day.today { border-color: var(--accent); }
.day.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; opacity: 1; }

.pop-foot { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; align-items: center; }
.pop-foot .spacer { flex: 1; }
.qbtn {
  height: 22px; padding: 0 10px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--glass);
  font-size: 10.5px; font-variant-numeric: tabular-nums;
}
.qbtn:hover { background: var(--glass-strong); }
.qbtn.sel { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.qbtn.danger { color: var(--late); }

.time-quick { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.time-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.col-label { font-size: 10px; color: var(--ink-dim); margin: 0 0 4px 4px; }
.col {
  position: relative;
  height: 176px;
  overflow-y: auto;
  padding: 4px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--glass);
  scrollbar-width: thin;
  scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
}
.tbtn {
  display: block;
  width: 100%;
  height: 30px;
  border: 0;
  border-radius: 10px;
  background: none;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}
.tbtn:hover { background: var(--glass-strong); }
.tbtn.sel { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

@media (max-width: 420px) {
  body { padding-block: 16px; }
  .app { padding: 32px 18px 24px; border-radius: 32px; min-height: 0; }
  .row { flex-wrap: wrap; }
  .pills { margin-left: 24px; }
  .acts { margin-left: auto; }
}

@media (prefers-reduced-motion: no-preference) {
  .btn, .pick, .filter, .check, .pill, .day, .tbtn, .qbtn { transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease; }
}
</style>

<main class="app" id="app">
  <p class="eyebrow">Min översikt</p>
  <h1>Idag</h1>
  <p class="sub" id="sub"></p>

  <form class="composer" id="composer" autocomplete="off">
    <input type="text" id="newTitle" placeholder="Ny task..." aria-label="Ny uppgift" maxlength="120">
    <button class="pick" id="dateBtn" type="button" data-picker title="Välj datum" aria-label="Välj datum" aria-haspopup="dialog" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 13V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h8"/><path d="M16 2v4M8 2v4M3 10h18M19 16v6M16 19h6"/></svg>
    </button>
    <button class="pick" id="timeBtn" type="button" data-picker title="Välj tid" aria-label="Välj tid" aria-haspopup="dialog" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9"/><path d="M12 7v5l3 2M19 2v6M16 5h6"/></svg>
    </button>
    <button class="btn" id="addBtn" type="submit" disabled>Lägg till</button>
  </form>
  <div class="chosen" id="chosen" aria-live="polite"></div>

  <section class="panel" aria-label="Uppgifter">
    <div class="filters" role="group" aria-label="Filter">
      <button class="filter" type="button" data-f="alla" aria-pressed="true">Alla</button>
      <button class="filter" type="button" data-f="idag" aria-pressed="false">Idag</button>
      <button class="filter" type="button" data-f="kommande" aria-pressed="false">Kommande</button>
    </div>
    <div id="list"></div>
  </section>

  <div class="pop" id="pop" role="dialog" hidden></div>
</main>

<script>
(function () {
  var KEY = "min-oversikt-v1";
  var DAYS = ["söndag", "måndag", "tisdag", "onsdag", "torsdag", "fredag", "lördag"];
  var MONTHS = ["januari", "februari", "mars", "april", "maj", "juni", "juli", "augusti", "september", "oktober", "november", "december"];
  var WEEK = ["M", "T", "O", "T", "F", "L", "S"];

  function iso(d) {
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  }
  function fromIso(s) { var p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function uid() { return Math.random().toString(36).slice(2, 9); }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function today() { return iso(new Date()); }

  function dateLabel(s) {
    var t = fromIso(today()), d = fromIso(s);
    var diff = Math.round((d - t) / 86400000);
    if (diff === 0) return "Idag";
    if (diff === 1) return "Imorgon";
    if (diff === -1) return "Igår";
    if (diff > 1 && diff < 7) return cap(DAYS[d.getDay()]);
    return s;
  }

  function seed() {
    var t = new Date();
    return [
      { id: uid(), title: "Ringa läkaren", date: iso(t), time: "10:30", done: false, open: false, subs: [] },
      { id: uid(), title: "Handla", date: iso(addDays(t, 2)), time: "10:24", done: false, open: false,
        subs: [{ id: uid(), title: "Ost", done: false }, { id: uid(), title: "Paprika", done: false }] },
      { id: uid(), title: "Städa", date: iso(addDays(t, 18)), time: "08:00", done: false, open: false, subs: [] }
    ];
  }

  var memory = null;
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var v = JSON.parse(raw); if (Array.isArray(v)) return v; }
    } catch (e) {}
    return memory || seed();
  }
  function save() {
    memory = tasks;
    try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
  }

  var tasks = load();
  var filter = "alla";
  var focusSub = null;
  var draft = { date: "", time: "" };
  var editing = null;
  var confirmDel = null;
  var focusEdit = false;

  var listEl = document.getElementById("list");
  var subEl = document.getElementById("sub");
  var titleIn = document.getElementById("newTitle");
  var chosenEl = document.getElementById("chosen");
  var addBtn = document.getElementById("addBtn");
  var dateBtn = document.getElementById("dateBtn");
  var timeBtn = document.getElementById("timeBtn");
  var appEl = document.getElementById("app");
  var pop = document.getElementById("pop");

  function syncAdd() { addBtn.disabled = !titleIn.value.trim(); }
  titleIn.addEventListener("input", syncAdd);

  function renderHeader() {
    var d = new Date();
    var left = tasks.filter(function (t) { return !t.done; }).length;
    subEl.textContent = cap(DAYS[d.getDay()]) + " " + d.getDate() + " " + MONTHS[d.getMonth()] + " · " + left + " kvar";
  }

  function visible() {
    var td = today();
    return tasks.filter(function (t) {
      if (filter === "idag") return t.date && t.date <= td;
      if (filter === "kommande") return t.date && t.date > td;
      return true;
    }).sort(function (a, b) {
      if (a.done !== b.done) return a.done ? 1 : -1;
      var ka = (a.date || "9999-99-99") + (a.time || "99:99");
      var kb = (b.date || "9999-99-99") + (b.time || "99:99");
      return ka < kb ? -1 : ka > kb ? 1 : 0;
    });
  }

  var ICON_EDIT = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
  var ICON_TRASH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/></svg>';

  function editForm(t, value, sid) {
    return '<form class="edit" data-act="edit-save" data-t="' + t.id + '"' + (sid ? ' data-s="' + sid + '"' : "") + '>' +
      '<input type="text" id="edit-input" value="' + esc(value) + '" maxlength="120" aria-label="Ändra text" autocomplete="off">' +
      '<button class="btn" type="submit">Spara</button></form>';
  }

  function titleHtml(t) {
    if (editing && editing.t === t.id && !editing.s) return editForm(t, t.title, null);
    return '<button class="title" type="button" data-act="open" data-t="' + t.id + '" aria-expanded="' + (t.open ? "true" : "false") + '">' + esc(t.title) + "</button>";
  }

  function subTitleHtml(t, s) {
    if (editing && editing.t === t.id && editing.s === s.id) return editForm(t, s.title, s.id);
    return '<button class="title" type="button" data-act="sub-edit" data-t="' + t.id + '" data-s="' + s.id + '" title="Ändra">' + esc(s.title) + "</button>";
  }

  function acts(t) {
    var del = confirmDel === t.id
      ? '<button class="icon confirm" type="button" data-act="del" data-t="' + t.id + '">Ta bort?</button>'
      : '<button class="icon" type="button" data-act="ask-del" data-t="' + t.id + '" aria-label="Ta bort ' + esc(t.title) + '" title="Ta bort">' + ICON_TRASH + "</button>";
    return '<div class="acts"><button class="icon" type="button" data-act="edit" data-t="' + t.id + '" aria-label="Ändra ' + esc(t.title) + '" title="Ändra">' + ICON_EDIT + "</button>" + del + "</div>";
  }

  function commitEdit(defer) {
    if (!editing) return;
    var inp = document.getElementById("edit-input");
    var t = find(editing.t);
    if (inp && t) {
      var v = inp.value.trim();
      if (v) {
        if (editing.s) {
          var s = t.subs.filter(function (x) { return x.id === editing.s; })[0];
          if (s) s.title = v;
        } else t.title = v;
        save();
      }
    }
    editing = null;
    if (defer) scheduleFlush(render); else render();
  }

  function pillBtn(kind, t, text, extra) {
    return '<button type="button" class="pill' + extra + '" data-picker data-act="edit-' + kind + '" data-t="' + t.id +
      '" aria-haspopup="dialog" aria-expanded="false" aria-label="' + (kind === "date" ? "Ändra datum" : "Ändra tid") + '">' + esc(text) + "</button>";
  }

  function render() {
    renderHeader();
    var items = visible();
    if (!items.length) {
      var msg = filter === "alla"
        ? "Inga uppgifter än. Skriv något i fältet ovan och tryck Lägg till."
        : filter === "idag" ? "Inget att göra idag." : "Inga kommande uppgifter med datum.";
      listEl.innerHTML = '<p class="empty">' + msg + "</p>";
      return;
    }
    var td = today();
    listEl.innerHTML = items.map(function (t) {
      var late = t.date && t.date < td && !t.done;
      var pills = "";
      if (t.date) pills += pillBtn("date", t, dateLabel(t.date), late ? " late" : "");
      else if (t.open) pills += pillBtn("date", t, "+ Datum", " add");
      if (t.time) pills += pillBtn("time", t, t.time, "");
      else if (t.open) pills += pillBtn("time", t, "+ Tid", " add");
      var subs = t.subs.length
        ? '<ul class="subs">' + t.subs.map(function (s) {
            return '<li class="sub-item' + (s.done ? " done" : "") + '">' +
              '<input class="check small" type="checkbox" data-act="sub-toggle" data-t="' + t.id + '" data-s="' + s.id + '"' + (s.done ? " checked" : "") + ' aria-label="Klar: ' + esc(s.title) + '">' +
              subTitleHtml(t, s) +
              '<button class="icon small" type="button" data-act="sub-del" data-t="' + t.id + '" data-s="' + s.id + '" aria-label="Ta bort ' + esc(s.title) + '" title="Ta bort">&times;</button>' +
              "</li>";
          }).join("") + "</ul>"
        : "";
      var more = t.open
        ? '<form class="more" data-act="sub-add" data-t="' + t.id + '">' +
            '<input type="text" id="sub-' + t.id + '" placeholder="Ny deluppgift..." aria-label="Ny deluppgift" maxlength="80" autocomplete="off">' +
            '<button class="btn" type="submit">Lägg till</button>' +
          "</form>"
        : "";
      return '<article class="task' + (t.done ? " done" : "") + '">' +
        '<div class="row"><div class="grow">' +
          '<input class="check" type="checkbox" data-act="toggle" data-t="' + t.id + '"' + (t.done ? " checked" : "") + ' aria-label="Klar: ' + esc(t.title) + '">' +
          titleHtml(t) +
        '</div><div class="pills">' + pills + "</div>" + acts(t) + "</div>" +
        subs + more + "</article>";
    }).join("");

    if (editing) {
      var ei = document.getElementById("edit-input");
      if (ei && document.activeElement !== ei) {
        ei.focus();
        if (focusEdit) { ei.select(); focusEdit = false; }
      }
    }

    if (focusSub) {
      var el = document.getElementById("sub-" + focusSub);
      if (el) el.focus();
      focusSub = null;
    }
  }

  function renderChosen() {
    var html = "";
    if (draft.date) html += '<span class="chip">' + esc(dateLabel(draft.date)) + '<button type="button" data-clear="date" aria-label="Rensa datum">&times;</button></span>';
    if (draft.time) html += '<span class="chip">' + esc(draft.time) + '<button type="button" data-clear="time" aria-label="Rensa tid">&times;</button></span>';
    chosenEl.innerHTML = html;
    dateBtn.classList.toggle("on", !!draft.date);
    timeBtn.classList.toggle("on", !!draft.time);
  }

  function find(id) { return tasks.filter(function (t) { return t.id === id; })[0]; }

  /* ---------- Väljare ---------- */
  var picker = null;
  var pendingFn = null;

  function flush() {
    if (!pendingFn) return;
    var f = pendingFn; pendingFn = null; f();
  }
  function scheduleFlush(fn) {
    pendingFn = fn;
    document.addEventListener("click", flush, { once: true });
    setTimeout(flush, 600);
  }

  function buildDate() {
    var v = picker.view, sel = picker.value, td = today();
    var first = new Date(v.y, v.m, 1);
    var off = (first.getDay() + 6) % 7;
    var html = '<div class="cal-head">' +
      '<button type="button" class="nav" data-p="prev" aria-label="Föregående månad">&#8249;</button>' +
      '<span class="cal-title">' + cap(MONTHS[v.m]) + " " + v.y + "</span>" +
      '<button type="button" class="nav" data-p="next" aria-label="Nästa månad">&#8250;</button></div>';
    html += '<div class="cal-week" aria-hidden="true">' + WEEK.map(function (w) { return "<span>" + w + "</span>"; }).join("") + "</div>";
    html += '<div class="cal-grid">';
    for (var i = 0; i < 42; i++) {
      var d = new Date(v.y, v.m, 1 - off + i), s = iso(d);
      html += '<button type="button" class="day' + (d.getMonth() !== v.m ? " out" : "") + (s === td ? " today" : "") + (s === sel ? " sel" : "") +
        '" data-p="day" data-v="' + s + '" aria-label="' + d.getDate() + " " + MONTHS[d.getMonth()] + '"' + (s === sel ? ' aria-pressed="true"' : "") + ">" + d.getDate() + "</button>";
    }
    html += "</div>";
    var t0 = new Date();
    html += '<div class="pop-foot">' +
      '<button type="button" class="qbtn" data-p="quick" data-v="' + iso(t0) + '">Idag</button>' +
      '<button type="button" class="qbtn" data-p="quick" data-v="' + iso(addDays(t0, 1)) + '">Imorgon</button>' +
      '<button type="button" class="qbtn" data-p="quick" data-v="' + iso(addDays(t0, 7)) + '">Om en vecka</button>' +
      '<span class="spacer"></span>' +
      (sel ? '<button type="button" class="qbtn danger" data-p="clear">Rensa</button>' : "") + "</div>";
    return html;
  }

  function buildTime() {
    var cur = picker.value || "";
    var mm = cur ? +cur.slice(3, 5) : -1;
    var mins = [];
    for (var m = 0; m < 60; m += 5) mins.push(m);
    if (mm >= 0 && mins.indexOf(mm) < 0) { mins.push(mm); mins.sort(function (a, b) { return a - b; }); }
    var hours = [];
    for (var h = 0; h < 24; h++) hours.push(h);
    var quick = ["08:00", "12:00", "17:00", "20:00"];
    return '<div class="time-quick">' + quick.map(function (q) {
        return '<button type="button" class="qbtn" data-p="qtime" data-v="' + q + '">' + q + "</button>";
      }).join("") + "</div>" +
      '<div class="time-cols">' +
        '<div><p class="col-label">Timme</p><div class="col" data-col="h">' + hours.map(function (x) {
          return '<button type="button" class="tbtn" data-p="hour" data-v="' + pad(x) + '">' + pad(x) + "</button>";
        }).join("") + "</div></div>" +
        '<div><p class="col-label">Minut</p><div class="col" data-col="m">' + mins.map(function (x) {
          return '<button type="button" class="tbtn" data-p="minute" data-v="' + pad(x) + '">' + pad(x) + "</button>";
        }).join("") + "</div></div>" +
      "</div>" +
      '<div class="pop-foot"><button type="button" class="qbtn danger" data-p="clear">Rensa</button><span class="spacer"></span>' +
      '<button type="button" class="btn" data-p="done">Klar</button></div>';
  }

  function markTime(center) {
    var cur = picker.value || "", hh = cur.slice(0, 2), mm = cur.slice(3, 5);
    pop.querySelectorAll("[data-p='hour']").forEach(function (b) { b.classList.toggle("sel", b.dataset.v === hh); });
    pop.querySelectorAll("[data-p='minute']").forEach(function (b) { b.classList.toggle("sel", b.dataset.v === mm); });
    pop.querySelectorAll("[data-p='qtime']").forEach(function (b) { b.classList.toggle("sel", b.dataset.v === cur); });
    if (center) {
      pop.querySelectorAll(".col").forEach(function (col) {
        var s = col.querySelector(".sel") || col.querySelector(".tbtn");
        if (s) col.scrollTop = s.offsetTop - col.clientHeight / 2 + s.offsetHeight / 2;
      });
    }
  }

  function placePicker() {
    if (!picker || !picker.anchor.isConnected) return;
    var ar = picker.anchor.getBoundingClientRect(), pr = appEl.getBoundingClientRect();
    var w = pop.offsetWidth;
    var left = ar.right - pr.left - w;
    left = Math.max(12, Math.min(left, pr.width - w - 12));
    pop.style.left = left + "px";
    pop.style.top = (ar.bottom - pr.top + 8) + "px";
  }

  function openPicker(kind, anchor, value, onChange, onClose, refocus) {
    picker = { kind: kind, anchor: anchor, value: value || "", onChange: onChange, onClose: onClose, refocus: refocus, view: null };
    if (kind === "date") {
      var base = value ? fromIso(value) : new Date();
      picker.view = { y: base.getFullYear(), m: base.getMonth() };
    }
    pop.className = "pop " + kind;
    pop.setAttribute("aria-label", kind === "date" ? "Välj datum" : "Välj tid");
    pop.innerHTML = kind === "date" ? buildDate() : buildTime();
    pop.hidden = false;
    anchor.setAttribute("aria-expanded", "true");
    placePicker();
    if (kind === "time") markTime(true);
    var f = pop.querySelector(".sel, .today") || pop.querySelector("button");
    if (f) f.focus({ preventScroll: true });
  }

  function closePicker(defer) {
    if (!picker) return;
    var p = picker;
    picker = null;
    pop.hidden = true;
    if (p.anchor && p.anchor.setAttribute) p.anchor.setAttribute("aria-expanded", "false");
    if (p.onClose) { if (defer) scheduleFlush(p.onClose); else p.onClose(); }
  }

  function refocus(sel) {
    var el = sel && document.querySelector(sel);
    if (el) el.focus();
  }

  function choose(v) {
    var sel = picker.refocus;
    picker.value = v;
    picker.onChange(v);
    closePicker();
    refocus(sel);
  }

  function setTime(hh, mm) {
    var cur = picker.value || "";
    var h = hh != null ? hh : (cur ? cur.slice(0, 2) : "09");
    var m = mm != null ? mm : (cur ? cur.slice(3, 5) : "00");
    picker.value = h + ":" + m;
    picker.onChange(picker.value);
    markTime(false);
  }

  pop.addEventListener("click", function (e) {
    var b = e.target.closest("[data-p]");
    if (!b || !picker) return;
    var p = b.dataset.p, v = b.dataset.v;
    if (p === "prev" || p === "next") {
      picker.view.m += p === "next" ? 1 : -1;
      if (picker.view.m < 0) { picker.view.m = 11; picker.view.y--; }
      if (picker.view.m > 11) { picker.view.m = 0; picker.view.y++; }
      pop.innerHTML = buildDate();
      var nb = pop.querySelector('[data-p="' + p + '"]');
      if (nb) nb.focus({ preventScroll: true });
    } else if (p === "day" || p === "quick") choose(v);
    else if (p === "clear") choose("");
    else if (p === "hour") setTime(v, null);
    else if (p === "minute") setTime(null, v);
    else if (p === "qtime") { picker.value = v; picker.onChange(v); markTime(true); }
    else if (p === "done") { var s = picker.refocus; closePicker(); refocus(s); }
  });

  document.addEventListener("pointerdown", function (e) {
    if (!picker) return;
    if (pop.contains(e.target)) return;
    if (e.target.closest("[data-picker]")) return;
    closePicker(true);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && picker) {
      e.stopPropagation();
      var s = picker.refocus;
      closePicker();
      refocus(s);
    }
  }, true);

  window.addEventListener("resize", placePicker);

  function composerPicker(kind, btn) {
    if (picker) {
      var same = picker.anchor === btn;
      closePicker();
      if (same) return;
    }
    openPicker(kind, btn, draft[kind], function (v) { draft[kind] = v; renderChosen(); }, null, "#" + btn.id);
  }
  dateBtn.addEventListener("click", function () { composerPicker("date", dateBtn); });
  timeBtn.addEventListener("click", function () { composerPicker("time", timeBtn); });

  function taskPicker(kind, btn) {
    var id = btn.dataset.t, t = find(id);
    if (!t) return;
    openPicker(kind, btn, t[kind], function (v) {
      t[kind] = v;
      if (kind === "time" && v && !t.date) t.date = today();
      save();
      if (btn.isConnected && v) {
        btn.textContent = kind === "date" ? dateLabel(v) : v;
        btn.classList.remove("add");
      }
    }, render, '[data-act="edit-' + kind + '"][data-t="' + id + '"]');
  }

  /* ---------- Händelser ---------- */
  document.getElementById("composer").addEventListener("submit", function (e) {
    e.preventDefault();
    var title = titleIn.value.trim();
    if (!title) { titleIn.focus(); return; }
    var date = draft.date || (draft.time ? today() : "");
    tasks.push({ id: uid(), title: title, date: date, time: draft.time || "", done: false, open: false, subs: [] });
    titleIn.value = ""; draft = { date: "", time: "" };
    if (picker) closePicker();
    syncAdd(); renderChosen(); save(); render(); titleIn.focus();
  });

  chosenEl.addEventListener("click", function (e) {
    var b = e.target.closest("[data-clear]");
    if (!b) return;
    draft[b.dataset.clear] = "";
    renderChosen();
  });

  document.querySelector(".filters").addEventListener("click", function (e) {
    var b = e.target.closest(".filter");
    if (!b) return;
    filter = b.dataset.f;
    document.querySelectorAll(".filter").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
    render();
  });

  listEl.addEventListener("change", function (e) {
    var el = e.target, act = el.dataset.act;
    var t = find(el.dataset.t);
    if (!t) return;
    if (act === "toggle") {
      t.done = el.checked;
      t.subs.forEach(function (s) { s.done = el.checked; });
    } else if (act === "sub-toggle") {
      var s = t.subs.filter(function (x) { return x.id === el.dataset.s; })[0];
      if (s) s.done = el.checked;
      t.done = t.subs.length > 0 && t.subs.every(function (x) { return x.done; });
    } else return;
    save(); render();
  });

  listEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-act]");
    if (!b) return;
    var t = find(b.dataset.t);
    if (!t) return;
    var act = b.dataset.act;
    if (act === "edit-date" || act === "edit-time") {
      var btn = b;
      if (picker) {
        var same = picker.anchor === btn;
        closePicker();
        if (same) return;
        btn = listEl.querySelector('[data-act="' + act + '"][data-t="' + t.id + '"]');
        if (!btn) return;
      }
      taskPicker(act === "edit-date" ? "date" : "time", btn);
      return;
    }
    if (picker) closePicker();
    if (act === "edit" || act === "sub-edit") {
      editing = { t: t.id, s: act === "sub-edit" ? b.dataset.s : null };
      confirmDel = null; focusEdit = true; render();
    }
    else if (act === "ask-del") {
      confirmDel = t.id; render();
      var cid = t.id;
      setTimeout(function () {
        if (confirmDel === cid) { confirmDel = null; if (!editing && !picker) render(); }
      }, 3000);
    }
    else if (act === "open") { t.open = !t.open; if (t.open) focusSub = t.id; render(); }
    else if (act === "del") { tasks = tasks.filter(function (x) { return x.id !== t.id; }); save(); render(); }
    else if (act === "sub-del") {
      t.subs = t.subs.filter(function (x) { return x.id !== b.dataset.s; });
      if (t.subs.length) t.done = t.subs.every(function (x) { return x.done; });
      save(); focusSub = t.id; render();
    }
  });

  listEl.addEventListener("submit", function (e) {
    var ef = e.target.closest("form[data-act='edit-save']");
    if (ef) { e.preventDefault(); commitEdit(false); return; }
    var f = e.target.closest("form[data-act='sub-add']");
    if (!f) return;
    e.preventDefault();
    var t = find(f.dataset.t);
    var inp = f.querySelector("input");
    var v = inp.value.trim();
    if (!t || !v) return;
    t.subs.push({ id: uid(), title: v, done: false });
    t.done = false;
    save(); focusSub = t.id; render();
  });

  listEl.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && e.target.id === "edit-input") { editing = null; render(); return; }
    if (e.key === "Escape") {
      var f = e.target.closest("form[data-act='sub-add']");
      if (f) { var t = find(f.dataset.t); if (t) { t.open = false; render(); } }
    }
  });

  listEl.addEventListener("focusout", function (e) {
    var inp = e.target;
    if (!inp || inp.id !== "edit-input" || !editing) return;
    if (e.relatedTarget && inp.form && inp.form.contains(e.relatedTarget)) return;
    commitEdit(true);
  });

  render();
  renderChosen();
  syncAdd();
})();
</script>

</body></html>
